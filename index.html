<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historical Atlas · Interactive Map Platform</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <h1>Historical Atlas</h1>
        <span class="subtitle">Interactive timeline · Conquests · Routes · Layers</span>
      </div>
      <div class="header-right">
        <button id="play-btn" title="Play timeline">▶</button>
        <button id="reset-view" title="Reset view">⌖</button>
        <label class="speed-label">Speed
          <input type="range" id="playback-speed" min="0.5" max="5" step="0.5" value="1">
        </label>
      </div>
    </header>
    <div id="map"></div>
    <div id="sidebar">
      <div class="panel">
        <h3>Timeline</h3>
        <div class="year-display" id="year-display">-1046 BCE</div>
        <input type="range" id="timeline" min="-1600" max="2000" value="-1046" step="1">
        <div class="period-info">
          <strong id="period-name">Western Zhou</strong>
          <span id="period-years"></span>
        </div>
      </div>
      <div class="panel">
        <h3>Layers</h3>
        <label><input type="checkbox" id="layer-main" checked> Main empires</label>
        <label><input type="checkbox" id="layer-periphery" checked> Other states</label>
        <label><input type="checkbox" id="layer-external" checked> Surrounding nations</label>
        <label><input type="checkbox" id="layer-routes"> Routes / shipping lanes</label>
        <label><input type="checkbox" id="layer-points"> Points / cities</label>
      </div>
      <div class="panel">
        <h3>Data</h3>
        <label class="file-label">Load GeoJSON <input type="file" id="geojson-file" accept=".geojson,.json" multiple></label>
        <button id="clear-data">Clear custom data</button>
        <div id="load-status"></div>
      </div>
      <div class="panel">
        <h3>Search</h3>
        <input type="text" id="search" placeholder="Search place or period...">
        <div id="search-results"></div>
      </div>
    </div>
    <div id="legend">
      <div class="legend-item"><span class="swatch main"></span> Main empire</div>
      <div class="legend-item"><span class="swatch periphery"></span> Other states</div>
      <div class="legend-item"><span class="swatch external"></span> Surrounding</div>
      <div class="legend-item"><span class="swatch route"></span> Routes</div>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
